name: Check EA for new matches

# EA only keeps a club's last 10 games, so check often enough that none slip through.
# EA's bot filter blocks Vercel's servers, so this runner fetches the data itself
# (connecting exactly like Chrome) and hands it to the site's /api/ingest endpoint.
# Supabase starts it every 10 minutes (supabase/migrations/0002_schedule_ea_check.sql);
# GitHub's own schedule is only a backup, since it often runs hours late.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: poll-ea
  cancel-in-progress: false

env:
  # other clubs whose EA data is held here until they have a site of their own (lib/hold.ts),
  # so none of their games drop off EA's last-10 list; space-separated club ids
  HOLD_CLUB_IDS: "1855658"

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts
            api

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch the club's data from EA
        # the club comes from the site (/api/club, picked on /setup); CLUB_ID as a repository
        # variable overrides it
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CLUB_ID: ${{ vars.CLUB_ID }}
          PLATFORM: ${{ vars.PLATFORM }}
        run: |
          pip install --quiet "curl_cffi>=0.7,<1"
          python scripts/fetch-ea.py payload.json

      - name: Send it to the site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # tolerate stray whitespace or a trailing slash in the secrets
          SITE_URL="$(printf '%s' "$SITE_URL" | tr -d '[:space:]')"
          SITE_URL="${SITE_URL%/}"
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the SITE_URL and CRON_SECRET repository secrets first."
            exit 1
          fi

          status=$(curl --silent --show-error --max-time 90 -o body.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            --data-binary @payload.json "$SITE_URL/api/ingest" || echo 000)
          body=$(head -c 400 body.txt 2>/dev/null | tr '\n' ' ')
          echo "HTTP $status: $body"

          case "$status" in
            200) echo "::notice::Saved: $body" ;;
            207) echo "::warning::Saved, with gaps: $body" ;;
            401|503) echo "::error::HTTP $status from the site: $body"; exit 1 ;;
            402|404) echo "::error::HTTP $status: SITE_URL ($SITE_URL) is not the production address, e.g. https://sarmagang-tracker.vercel.app"; exit 1 ;;
            *) echo "::error::HTTP $status from $SITE_URL: $body"; exit 1 ;;
          esac

      - name: Hold other clubs' data
        # runs even when the club's own check failed, and never fails the run itself
        if: ${{ always() && env.HOLD_CLUB_IDS != '' }}
        continue-on-error: true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          SITE_URL="$(printf '%s' "$SITE_URL" | tr -d '[:space:]')"
          SITE_URL="${SITE_URL%/}"
          CRON_SECRET="$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')"
          for club in $HOLD_CLUB_IDS; do
            if ! CLUB_ID="$club" PLATFORM=common-gen5 python scripts/fetch-ea.py "held-$club.json"; then
              echo "::warning::Couldn't fetch club $club from EA this time"
              continue
            fi
            python - "$club" "held-$club.json" <<'PY'
          import json, sys
          json.dump({"clubId": sys.argv[1], "payload": json.load(open(sys.argv[2]))}, open("held-body.json", "w"))
          PY
            status=$(curl --silent --show-error --max-time 90 -o held.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
              --data-binary @held-body.json "$SITE_URL/api/hold" || echo 000)
            echo "held $club: HTTP $status $(head -c 200 held.txt)"
            [ "$status" = "200" ] || echo "::warning::Holding club $club failed: HTTP $status"
          done
