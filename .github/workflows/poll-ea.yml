name: Check EA for new matches

# EA only keeps a club's last 10 games, so check often enough that none slip through.
# Every 30 minutes stays inside the free Actions minutes of a private repo.
# For a public repo you can change this to "*/15 * * * *".
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: poll-ea
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger the site's EA check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add the SITE_URL and CRON_SECRET repository secrets first."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/poll"
