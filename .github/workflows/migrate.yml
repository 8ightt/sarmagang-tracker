name: Apply database migrations

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: supabase/migrations

      - name: Apply new migrations
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Add the DATABASE_URL repository secret to apply migrations automatically."
            exit 0
          fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            create table if not exists schema_migrations (
              name text primary key,
              applied_at timestamptz not null default now()
            );
            alter table schema_migrations enable row level security;"

          # 0001-0003 were run by hand in the SQL Editor (0002 needs a GitHub token pasted in).
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            insert into schema_migrations (name) values
              ('0001_init.sql'), ('0002_schedule_ea_check.sql'), ('0003_live_schedule.sql')
            on conflict do nothing;"

          for file in $(ls supabase/migrations/*.sql | sort); do
            name=$(basename "$file")
            done=$(psql "$DATABASE_URL" -tA -c "select 1 from schema_migrations where name = '$name'")
            if [ "$done" = "1" ]; then
              echo "skip  $name"
              continue
            fi
            echo "apply $name"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q --single-transaction \
              -f "$file" \
              -c "insert into schema_migrations (name) values ('$name')"
            echo "::notice::Applied $name"
          done
